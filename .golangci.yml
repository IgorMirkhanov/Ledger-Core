version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115 # int conversions are checked explicitly in internal/money
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - gen/
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/IgorMirkhanov/ledger-core
