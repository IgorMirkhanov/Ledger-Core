version: 2
# target-branch is explicit: PRs must go to main even while the repository default branch differs.
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    groups:
      otel: {patterns: ["go.opentelemetry.io/*"]}
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule: {interval: weekly}
    ignore:
      # A Go minor upgrade touches go.mod (toolchain), CI and the Dockerfile together; do it deliberately.
      # Patch updates (1.26.x) still arrive automatically.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
