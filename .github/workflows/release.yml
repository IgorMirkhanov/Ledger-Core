name: Release

# Push a tag like v0.1.0, or run manually with a version: every service image is built from main
# (or the tag), scanned, then pushed to GHCR, signed, and a GitHub Release is created.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from main, e.g. v0.1.0 (the tag is created by the workflow)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Resolves the version and, for a manual run, creates the tag on the current main.
  # A tag pushed with GITHUB_TOKEN does not trigger this workflow again.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::manual releases run from main only"; exit 1; }
            VERSION="${INPUT}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3, got '${VERSION}'"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::tag ${VERSION} already exists"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Ledger Core ${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Third-party scanners run WITHOUT registry or OIDC permissions: a compromised action here
  # cannot publish or sign images. Publishing happens only if every scan passes.
  scan:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, accounts, transfers, notifications, reconciler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          tags: ledger-core-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ledger-core-${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: [version, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signing (Sigstore OIDC)
    strategy:
      matrix:
        service: [gateway, accounts, transfers, notifications, reconciler]
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ledger-core-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=sha,format=long
      - id: push
        name: Build and push with SBOM and provenance (same inputs and cache as the scanned build)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          {
            echo "## Images (signed with cosign, SBOM + provenance attached)"
            echo
            for s in gateway accounts transfers notifications reconciler; do
              echo "- \`ghcr.io/${owner}/ledger-core-${s}:${VERSION#v}\`"
            done
            echo
            echo "Verify: \`cosign verify ghcr.io/${owner}/ledger-core-gateway:${VERSION#v} --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } > notes.md
          gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --title "Ledger Core ${VERSION}" \
            --notes-file notes.md --generate-notes --verify-tag
