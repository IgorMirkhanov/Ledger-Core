name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.13.2 }

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          # Включить после первого релиза контрактов: breaking: ${{ github.event_name == 'pull_request' }}
          breaking: false
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"
          push: false

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Unit tests (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...
      - name: Integration tests (testcontainers)
        run: go test -race -count=1 -tags=integration -timeout=10m ./tests/integration/...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, openapi]
    strategy:
      matrix:
        service: [gateway, accounts, transfers, notifications, reconciler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1 lint api/openapi.yaml
