name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.8" } # keep in sync with the toolchain directive in go.mod
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.13.2 }

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          # Включить после первого релиза контрактов: breaking: ${{ github.event_name == 'pull_request' }}
          breaking: false
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"
          push: false
          pr_comment: false # the workflow token is read-only

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.8" } # keep in sync with the toolchain directive in go.mod
      - name: Unit tests (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./internal/...
      - name: Coverage report + gate (core packages ≥70%)
        run: |
          set -euo pipefail
          TOTAL=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "total_coverage=${TOTAL}%"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Total \`internal/...\`: **${TOTAL}%**" >> "$GITHUB_STEP_SUMMARY"
          go test -count=1 -coverprofile=core.out \
            ./internal/accounts/domain \
            ./internal/transfers/domain \
            ./internal/money \
            ./internal/transfers/service \
            ./internal/transfers/worker
          CORE=$(go tool cover -func=core.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          echo "core_coverage=${CORE}%"
          echo "Core packages: **${CORE}%**" >> "$GITHUB_STEP_SUMMARY"
          awk -v p="$CORE" 'BEGIN { if (p+0 < 70) { print "core coverage below 70%: " p; exit 1 } }'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Integration tests (testcontainers)
        run: go test -race -count=1 -tags=integration -timeout=10m ./tests/integration/...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, openapi]
    strategy:
      matrix:
        service: [gateway, accounts, transfers, notifications, reconciler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1 lint api/openapi.yaml
