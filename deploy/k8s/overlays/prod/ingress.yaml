apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.ledger.example.com]
      secretName: gateway-tls
  rules:
    - host: api.ledger.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service: {name: gateway, port: {name: http}}
