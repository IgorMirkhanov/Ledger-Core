# Non-secret settings shared by all services. Secrets live in the "ledger-secrets" Secret
# (see secret.example.yaml); they are never committed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
data:
  APP_ENV: prod
  LOG_LEVEL: info
  ADMIN_ADDR: ":8081"
  GRPC_ADDR: ":9090"
  SHUTDOWN_TIMEOUT: 15s
  # Production switches, enforced at startup by config.CheckProd.
  POSTGRES_MIGRATE_ON_START: "false"
  KAFKA_AUTO_CREATE_TOPICS: "false"
  GRPC_REFLECTION: "false"
  KAFKA_BROKERS: kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability:4317
  # Headless services: DNS returns every pod, the client balances round_robin (grpcx.Dial).
  ACCOUNTS_GRPC_ADDR: dns:///accounts-grpc:9090
  TRANSFERS_GRPC_ADDR: dns:///transfers-grpc:9090
  REDIS_ADDR: redis:6379
  RATE_LIMIT_RPS: "50"
  RATE_LIMIT_IP_RPS: "100"
  # Set to the CIDR of the ingress controller pods so X-Forwarded-For is trusted only from them.
  TRUSTED_PROXY_CIDRS: ""
