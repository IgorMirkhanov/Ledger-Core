apiVersion: v1
kind: ServiceAccount
metadata:
  name: notifications
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels: {app.kubernetes.io/name: notifications}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: notifications}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: notifications, app.kubernetes.io/part-of: ledger-core}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: notifications
      automountServiceAccountToken: false
      # > SHUTDOWN_TIMEOUT (15s) + preStop (5s): the app drains before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: notifications}
      containers:
        - name: notifications
          image: ghcr.io/igormirkhanov/ledger-core-notifications:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: ledger-config}
          env:
            - name: SERVICE_NAME
              value: notifications
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: ledger-secrets, key: NOTIFICATIONS_POSTGRES_DSN}
            - name: KAFKA_CONSUMER_GROUP
              value: "notifications"
          ports:
            - name: admin
              containerPort: 8081
          startupProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Keep serving while endpoints propagate removal of this pod (Kubernetes >= 1.30).
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifications
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: notifications}
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-admin
  labels: {app.kubernetes.io/name: notifications}
spec:
  selector: {app.kubernetes.io/name: notifications}
  ports:
    - {name: admin, port: 8081, targetPort: admin}
