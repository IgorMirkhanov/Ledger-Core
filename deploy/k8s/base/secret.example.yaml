# EXAMPLE ONLY — not part of the kustomization. Create the real Secret from a secret manager
# (External Secrets Operator, Vault, sealed-secrets). Every service reads only its own DSN.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: ledger
type: Opaque
stringData:
  ACCOUNTS_POSTGRES_DSN: postgres://accounts:CHANGE_ME@pg-accounts:5432/accounts?sslmode=verify-full
  TRANSFERS_POSTGRES_DSN: postgres://transfers:CHANGE_ME@pg-transfers:5432/transfers?sslmode=verify-full
  NOTIFICATIONS_POSTGRES_DSN: postgres://notifications:CHANGE_ME@pg-notifications:5432/notifications?sslmode=verify-full
  # Read-only role created by migrations/accounts/00002_reconciler_grants.sql.
  RECONCILER_POSTGRES_DSN: postgres://reconciler:CHANGE_ME@pg-accounts-replica:5432/accounts?sslmode=verify-full
  # At least 32 random bytes: openssl rand -base64 48
  JWT_SECRET: CHANGE_ME_AT_LEAST_32_RANDOM_BYTES
