apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels: {app.kubernetes.io/name: accounts}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: accounts}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: accounts, app.kubernetes.io/part-of: ledger-core}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: accounts
      automountServiceAccountToken: false
      # > SHUTDOWN_TIMEOUT (15s) + preStop (5s): the app drains before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: accounts}
      containers:
        - name: accounts
          image: ghcr.io/igormirkhanov/ledger-core-accounts:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: ledger-config}
          env:
            - name: SERVICE_NAME
              value: accounts
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: ledger-secrets, key: ACCOUNTS_POSTGRES_DSN}
          ports:
            - name: grpc
              containerPort: 9090
            - name: admin
              containerPort: 8081
          startupProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Keep serving while endpoints propagate removal of this pod (Kubernetes >= 1.30).
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 1, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: accounts
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: accounts}
---
# Headless: DNS returns every pod IP so gRPC clients balance round_robin across replicas.
apiVersion: v1
kind: Service
metadata:
  name: accounts-grpc
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: accounts}
  ports:
    - {name: grpc, port: 9090, targetPort: grpc, appProtocol: grpc}
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-admin
  labels: {app.kubernetes.io/name: accounts}
spec:
  selector: {app.kubernetes.io/name: accounts}
  ports:
    - {name: admin, port: 8081, targetPort: admin}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: accounts
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: accounts}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
