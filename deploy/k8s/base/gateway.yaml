apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: ledger-core}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      # > SHUTDOWN_TIMEOUT (15s) + preStop (5s): the app drains before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: gateway}
      containers:
        - name: gateway
          image: ghcr.io/igormirkhanov/ledger-core-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: ledger-config}
          env:
            - name: SERVICE_NAME
              value: gateway
            - name: HTTP_ADDR
              value: ":8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: ledger-secrets, key: JWT_SECRET}
            - name: UPSTREAM_TIMEOUT
              value: "5s"
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 8081
          startupProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: admin}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: admin}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Keep serving while endpoints propagate removal of this pod (Kubernetes >= 1.30).
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: 1, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gateway}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app.kubernetes.io/name: gateway}
spec:
  selector: {app.kubernetes.io/name: gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: admin, port: 8081, targetPort: admin}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
