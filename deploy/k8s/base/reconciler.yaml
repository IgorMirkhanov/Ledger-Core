apiVersion: v1
kind: ServiceAccount
metadata:
  name: reconciler
automountServiceAccountToken: false
---
# Daily ledger reconciliation (docs/adr/0007). Exit code 2 = discrepancies: the Job fails and alerts fire.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciler
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: {app.kubernetes.io/name: reconciler, app.kubernetes.io/part-of: ledger-core}
        spec:
          restartPolicy: Never
          serviceAccountName: reconciler
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reconciler
              image: ghcr.io/igormirkhanov/ledger-core-reconciler:latest
              envFrom:
                - configMapRef: {name: ledger-config}
              env:
                - name: SERVICE_NAME
                  value: reconciler
                - name: POSTGRES_DSN
                  valueFrom:
                    secretKeyRef: {name: ledger-secrets, key: RECONCILER_POSTGRES_DSN}
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway.observability:9091
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
