# Default deny ingress; each service accepts only its known callers.
# accounts trusts x-caller=transfers (docs/adr/0008), so ONLY transfers and gateway may reach its gRPC port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accounts-grpc
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: accounts}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: transfers}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
      ports:
        - {port: 9090, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transfers-grpc
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: transfers}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: gateway}}
      ports:
        - {port: 9090, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-http
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {port: 8080, protocol: TCP}
---
# Metrics and probes: Prometheus from the observability namespace. Kubelet probes are not subject to NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-from-monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: ledger-core}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {port: 8081, protocol: TCP}
